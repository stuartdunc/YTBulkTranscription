[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytbulktranscription"
version = "0.1.0"
description = "Local FastAPI app for collecting YouTube transcripts into Markdown files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "yt-dlp>=2025.1.15",
  "youtube-transcript-api>=0.6.2,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "httpx>=0.28,<1.0",
]
stt = [
  "faster-whisper>=1.1.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
