<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <script src="{{ url_for('static', path='/htmx.min.js') }}" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Local Transcript Collector</p>
        <h1>{{ app_name }}</h1>
        <p class="hero-copy">Analyze a video, playlist, or channel URL, then write clean Markdown transcripts into a channel-based folder structure.</p>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
